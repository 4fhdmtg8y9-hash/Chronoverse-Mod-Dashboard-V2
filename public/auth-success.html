```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chronoverse • Signing In</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background: #0b0b12;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 420px;

      margin: 20px;
      padding: 35px;

      text-align: center;

      background: #11111b;

      border: 1px solid #252535;
      border-radius: 16px;
    }

    .loader {
      width: 42px;
      height: 42px;

      margin: 0 auto 22px;

      border: 4px solid #252535;
      border-top-color: #ffffff;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    p {
      color: #9292a7;
      line-height: 1.5;
    }

    .error {
      color: #ffbcbc;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="loader"></div>

    <h1>
      Signing you in...
    </h1>

    <p id="message">
      Verifying your Chronoverse staff account.
    </p>

  </main>

  <script>
    async function finishLogin() {
      const message =
        document.getElementById("message");

      try {
        const params =
          new URLSearchParams(
            window.location.search
          );

        const encodedUser =
          params.get("user");

        if (!encodedUser) {
          throw new Error(
            "Missing login information."
          );
        }

        const json =
          decodeURIComponent(
            escape(
              atob(
                encodedUser
                  .replace(/-/g, "+")
                  .replace(/_/g, "/")
              )
            )
          );

        const user =
          JSON.parse(json);

        if (
          !user.id ||
          !user.username
        ) {
          throw new Error(
            "Invalid Discord user information."
          );
        }

        localStorage.setItem(
          "discord_user_id",
          user.id
        );

        localStorage.setItem(
          "discord_username",
          user.username
        );

        localStorage.setItem(
          "discord_avatar",
          user.avatar || ""
        );

        try {
          await fetch(
            "/api/moderators/save",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                id: user.id,
                username: user.username,
                avatar: user.avatar || null
              })
            }
          );
        } catch (error) {
          console.error(
            "Moderator save failed:",
            error
          );
        }

        window.location.replace(
          "/dashboard.html"
        );

      } catch (error) {
        console.error(error);

        message.textContent =
          "Login failed. Please return to the login page and try again.";

        message.className =
          "error";

        document.querySelector(
          ".loader"
        ).style.display = "none";
      }
    }

    finishLogin();
  </script>

</body>
</html>
```
