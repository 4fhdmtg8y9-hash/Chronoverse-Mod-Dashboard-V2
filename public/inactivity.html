<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronoverse • Inactivity</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #ffffff;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 45px 25px;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #9292a7;
      text-decoration: none;
    }

    .back:hover {
      color: #ffffff;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9292a7;
      margin-bottom: 28px;
    }

    .notices {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .notice {
      background: #11111b;
      border: 1px solid #252535;
      border-radius: 14px;
      padding: 20px;
    }

    .notice-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
    }

    .username {
      font-weight: 700;
    }

    .status {
      color: #9292a7;
      font-size: 12px;
      text-transform: uppercase;
    }

    .reason {
      color: #9292a7;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .date {
      color: #77778b;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .approve {
      background: #ffffff;
      color: #11111b;
    }

    .deny {
      background: #252535;
      color: #ffffff;
    }

    .loading,
    .empty,
    .error {
      padding: 40px;
      text-align: center;
      color: #9292a7;
    }
  </style>
</head>

<body>

  <main class="page">

    <a href="/dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <h1>Inactivity Notices</h1>

    <p class="subtitle">
      Review pending staff inactivity notices.
    </p>

    <section class="notices" id="notices">
      <div class="loading">
        Loading inactivity notices...
      </div>
    </section>

  </main>

  <script>
    const reviewerId =
      localStorage.getItem("discord_user_id");

    async function loadNotices() {
      const container =
        document.getElementById("notices");

      try {
        const response =
          await fetch("/api/inactivity/list");

        if (!response.ok) {
          throw new Error(
            "Failed to load inactivity notices"
          );
        }

        const data = await response.json();

        const notices =
          (data.notices || []).filter(
            notice => notice.status === "pending"
          );

        if (!notices.length) {
          container.innerHTML = `
            <div class="empty">
              No pending inactivity notices.
            </div>
          `;
          return;
        }

        container.innerHTML =
          notices.map(notice => `
            <article class="notice">

              <div class="notice-top">
                <span class="username">
                  ${escapeHtml(notice.username)}
                </span>

                <span class="status">
                  ${escapeHtml(notice.status)}
                </span>
              </div>

              <div class="reason">
                ${escapeHtml(notice.reason)}
              </div>

              <div class="date">
                Submitted:
                ${formatDate(notice.created_at)}
              </div>

              <div class="buttons">

                <button
                  class="approve"
                  onclick="reviewNotice(
                    ${notice.id},
                    'approved'
                  )"
                >
                  Approve
                </button>

                <button
                  class="deny"
                  onclick="reviewNotice(
                    ${notice.id},
                    'denied'
                  )"
                >
                  Deny
                </button>

              </div>

            </article>
          `).join("");

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="error">
            Unable to load inactivity notices.
          </div>
        `;
      }
    }

    async function reviewNotice(
      noticeId,
      status
    ) {
      if (!reviewerId) {
        alert("You must be logged in.");
        return;
      }

      try {
        const response =
          await fetch("/api/inactivity/review", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              notice_id: noticeId,
              status,
              reviewed_by: reviewerId
            })
          });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Unable to review inactivity notice"
          );
        }

        await loadNotices();

      } catch (error) {
        console.error(error);

        alert(
          "Unable to review inactivity notice."
        );
      }
    }

    function formatDate(value) {
      if (!value) return "Unknown date";

      return new Date(value).toLocaleString();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadNotices();
  </script>

</body>
</html>
