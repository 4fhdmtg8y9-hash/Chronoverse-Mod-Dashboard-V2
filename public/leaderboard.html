<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chronoverse • Leaderboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #ffffff;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 45px 25px;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
      color: #9292a7;
      text-decoration: none;
    }

    .back:hover {
      color: #ffffff;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9292a7;
      margin-bottom: 30px;
    }

    .leaderboard {
      background: #11111b;
      border: 1px solid #252535;
      border-radius: 14px;
      overflow: hidden;
    }

    .row {
      display: grid;
      grid-template-columns: 70px 1fr 150px;
      align-items: center;

      padding: 18px 22px;

      border-bottom: 1px solid #252535;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .header-row {
      color: #9292a7;
      font-size: 13px;
      text-transform: uppercase;
    }

    .rank {
      font-weight: 700;
    }

    .name {
      font-weight: 600;
    }

    .points {
      text-align: right;
      font-weight: 700;
    }

    .loading,
    .empty,
    .error {
      padding: 40px;
      text-align: center;
      color: #9292a7;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 50px 1fr 100px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <a
      class="back"
      href="/dashboard.html"
    >
      ← Back to Dashboard
    </a>

    <h1>
      Moderator Leaderboard
    </h1>

    <p class="subtitle">
      Chronoverse staff rankings based on moderation points.
    </p>

    <section class="leaderboard">

      <div class="row header-row">
        <div>Rank</div>
        <div>Moderator</div>
        <div style="text-align:right;">
          Points
        </div>
      </div>

      <div id="leaderboard">

        <div class="loading">
          Loading leaderboard...
        </div>

      </div>

    </section>

  </main>

  <script>
    async function loadLeaderboard() {
      const container =
        document.getElementById("leaderboard");

      try {
        const response =
          await fetch("/api/leaderboard");

        if (!response.ok) {
          throw new Error(
            "Unable to load leaderboard"
          );
        }

        const data =
          await response.json();

        const leaderboard =
          data.leaderboard || [];

        if (!leaderboard.length) {
          container.innerHTML = `
            <div class="empty">
              No moderation points have been recorded yet.
            </div>
          `;

          return;
        }

        container.innerHTML =
          leaderboard
            .map(
              (moderator, index) => `
                <div class="row">

                  <div class="rank">
                    #${index + 1}
                  </div>

                  <div class="name">
                    ${escapeHtml(
                      moderator.moderator_name
                    )}
                  </div>

                  <div class="points">
                    ${Number(
                      moderator.points || 0
                    )} pts
                  </div>

                </div>
              `
            )
            .join("");

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="error">
            Unable to load the leaderboard.
          </div>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadLeaderboard();
  </script>

</body>
</html>
