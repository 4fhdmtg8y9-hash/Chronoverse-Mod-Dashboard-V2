<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronoverse • My Actions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #ffffff;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 45px 25px;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #9292a7;
      text-decoration: none;
    }

    .back:hover {
      color: #ffffff;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9292a7;
      margin-bottom: 28px;
    }

    .actions-list {
      background: #11111b;
      border: 1px solid #252535;
      border-radius: 14px;
      overflow: hidden;
    }

    .action {
      padding: 20px 22px;
      border-bottom: 1px solid #252535;
    }

    .action:last-child {
      border-bottom: none;
    }

    .action-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
    }

    .type {
      font-weight: 700;
      text-transform: capitalize;
    }

    .date {
      color: #77778b;
      font-size: 13px;
    }

    .target {
      margin-bottom: 6px;
      color: #d5d5df;
    }

    .reason {
      color: #9292a7;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty,
    .error,
    .loading {
      padding: 45px;
      text-align: center;
      color: #9292a7;
    }
  </style>
</head>

<body>

  <main class="page">

    <a href="/dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <h1>My Actions</h1>

    <p class="subtitle">
      Your recorded moderation history.
    </p>

    <section class="actions-list" id="actions-list">

      <div class="loading">
        Loading your actions...
      </div>

    </section>

  </main>

  <script>
    async function loadActions() {
      const container = document.getElementById("actions-list");

      const moderatorId = localStorage.getItem("discord_user_id");

      if (!moderatorId) {
        container.innerHTML = `
          <div class="error">
            You must be logged in to view your actions.
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(
          `/api/actions/my-actions?moderator_id=${encodeURIComponent(moderatorId)}`
        );

        if (!response.ok) {
          throw new Error("Failed to load actions");
        }

        const data = await response.json();
        const actions = data.actions || [];

        if (actions.length === 0) {
          container.innerHTML = `
            <div class="empty">
              You have no recorded moderation actions yet.
            </div>
          `;
          return;
        }

        container.innerHTML = actions.map(action => `
          <div class="action">

            <div class="action-top">
              <span class="type">
                ${escapeHtml(action.action_type)}
              </span>

              <span class="date">
                ${formatDate(action.created_at)}
              </span>
            </div>

            <div class="target">
              Target:
              ${escapeHtml(
                action.target_user_name ||
                action.target_user_id ||
                "Unknown user"
              )}
            </div>

            <div class="reason">
              ${escapeHtml(action.reason || "No reason provided.")}
            </div>

          </div>
        `).join("");

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="error">
            Unable to load your moderation actions.
          </div>
        `;
      }
    }

    function formatDate(value) {
      if (!value) return "Unknown date";

      return new Date(value).toLocaleString();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadActions();
  </script>

</body>
</html>
