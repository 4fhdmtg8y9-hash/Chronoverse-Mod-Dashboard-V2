<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chronoverse • Log Action</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;

    h1 {
      font-size: 32px;

      color: #9292a7;

<body>

  <main class="page">

    <a href="/dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <h1>Log Moderation Action</h1>

    <p class="subtitle">
      Submit an action for staff verification.
    </p>

    <form
      class="form-card"
      id="action-form"
      enctype="multipart/form-data"
    >

      <div class="field">
        <label for="action-type">
          Action Type
        </label>

        <select id="action-type" required>
          <option value="">
            Select an action
          </option>
        </select>
      </div>

      <div class="field">
        <label for="target-id">
          Target Discord User ID
        </label>

        <input
          id="target-id"
          type="text"
          placeholder="Discord user ID"
        >
      </div>

      <div class="field">
        <label for="target-name">
          Target Username
        </label>

        <input
          id="target-name"
          type="text"
          placeholder="Username"
        >
      </div>

      <div class="field">
        <label for="reason">
          Reason
        </label>

        <textarea
          id="reason"
          placeholder="Explain why the action was taken..."
        ></textarea>
      </div>

      <div class="field">
        <label for="evidence">
          Evidence / Screenshot
        </label>

        <div class="evidence-box">

          <input
            id="evidence"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
          >

          <div class="hint">
            Optional. PNG, JPG, WEBP or GIF. Maximum 4 MB.
          </div>

          <div
            class="preview"
            id="preview"
          >
            <img
              id="preview-image"
              alt="Evidence preview"
            >
          </div>

        </div>
      </div>

      <button
        id="submit-button"
        class="submit"
        type="submit"
      >
        Submit for Verification
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

  </main>

  <script>
    const form =
      document.getElementById("action-form");

    const actionType =
      document.getElementById("action-type");

    const evidenceInput =
      document.getElementById("evidence");

    const preview =
      document.getElementById("preview");

    const previewImage =
      document.getElementById("preview-image");

    const submitButton =
      document.getElementById("submit-button");

    const message =
      document.getElementById("message");

    async function requireLogin() {
      try {
        const response =
          await fetch("/api/auth/me");

        if (!response.ok) {
          window.location.replace("/");
          return false;
        }

        return true;

      } catch (error) {
        console.error(error);
        window.location.replace("/");
        return false;
      }
    }

    async function loadActionTypes() {
      try {
        const response =
          await fetch("/api/actions/types");

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Unable to load action types"
          );
        }

        for (const type of data.action_types || []) {
          const option =
            document.createElement("option");

          option.value = type;
          option.textContent =
            formatActionName(type);

          actionType.appendChild(option);
        }

      } catch (error) {
        console.error(error);

        message.textContent =
          "Unable to load moderation action types.";

        message.className =
          "message error";
      }
    }

    evidenceInput.addEventListener(
      "change",
      () => {
        const file =
          evidenceInput.files[0];

        preview.style.display =
          "none";

        previewImage.src = "";

        if (!file) {
          return;
        }

        const allowedTypes = [
          "image/png",
          "image/jpeg",
          "image/webp",
          "image/gif"
        ];

        if (!allowedTypes.includes(file.type)) {
          evidenceInput.value = "";

          message.textContent =
            "Evidence must be PNG, JPG, WEBP or GIF.";

          message.className =
            "message error";

          return;
        }

        if (file.size > 4 * 1024 * 1024) {
          evidenceInput.value = "";

          message.textContent =
            "Evidence must be smaller than 4 MB.";

          message.className =
            "message error";

          return;
        }

        previewImage.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

        message.textContent = "";
        message.className = "message";
      }
    );

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        submitButton.disabled = true;

        message.textContent =
          "Submitting...";

        message.className =
          "message";

        try {
          const formData =
            new FormData();

          formData.append(
            "action_type",
            actionType.value
          );

          formData.append(
            "target_user_id",
            document
              .getElementById("target-id")
              .value
              .trim()
          );

          formData.append(
            "target_user_name",
            document
              .getElementById("target-name")
              .value
              .trim()
          );

          formData.append(
            "reason",
            document
              .getElementById("reason")
              .value
              .trim()
          );

          const evidence =
            evidenceInput.files[0];

          if (evidence) {
            formData.append(
              "evidence",
              evidence
            );
          }

          const response =
            await fetch(
              "/api/actions/log",
              {
                method: "POST",
                body: formData
              }
            );

          const data =
            await response.json();

          if (response.status === 401) {
            window.location.replace("/");
            return;
          }

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Unable to submit action"
            );
          }

          form.reset();

          preview.style.display =
            "none";

          previewImage.src = "";

          message.textContent =
            "Action submitted. It is waiting for verification.";

          message.className =
            "message success";

        } catch (error) {
          console.error(error);

          message.textContent =
            error.message ||
            "Unable to submit moderation action.";

          message.className =
            "message error";
        }

        submitButton.disabled = false;
      }
    );

    function formatActionName(value) {
      return value
        .replaceAll("_", " ")
        .replace(
          /\b\w/g,
          letter =>
            letter.toUpperCase()
        );
    }

    async function start() {
      const loggedIn =
        await requireLogin();

      if (!loggedIn) {
        return;
      }

      await loadActionTypes();
    }

    start();
  </script>

</body>
</html>
