```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chronoverse Moderator Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #ffffff;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      padding: 25px 18px;
      background: #11111b;
      border-right: 1px solid #252535;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 35px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav button {
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #aaaabd;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .nav button:hover,
    .nav button.active {
      background: #1d1d2b;
      color: #ffffff;
    }

    .profile {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid #252535;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #252535;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-label {
      color: #77778b;
      font-size: 11px;
      margin-top: 2px;
    }

    .logout {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #303043;
      border-radius: 8px;
      background: transparent;
      color: #aaaabd;
      cursor: pointer;
    }

    .logout:hover {
      background: #1d1d2b;
      color: #ffffff;
    }

    .main {
      margin-left: 240px;
      padding: 35px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .header p {
      color: #9292a7;
    }

    .quick-action {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #ffffff;
      color: #11111b;
      font-weight: 700;
      cursor: pointer;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      padding: 22px;
      background: #11111b;
      border: 1px solid #252535;
      border-radius: 12px;
    }

    .card-title {
      color: #9292a7;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 700;
    }

    .section {
      padding: 25px;
      background: #11111b;
      border: 1px solid #252535;
      border-radius: 12px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #77778b;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 190px;
      }

      .main {
        margin-left: 190px;
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      Chronoverse
    </div>

    <nav class="nav">

      <button
        class="active"
        onclick="window.location.href='/dashboard.html'"
      >
        Overview
      </button>

      <button
        onclick="window.location.href='/log-action.html'"
      >
        Log Action
      </button>

      <button
        onclick="window.location.href='/my-actions.html'"
      >
        My Actions
      </button>

      <button
        onclick="window.location.href='/requests.html'"
      >
        Requests
      </button>

      <button
        onclick="window.location.href='/inactivity.html'"
      >
        Inactivity
      </button>

      <button
        onclick="window.location.href='/announcements.html'"
      >
        Announcements
      </button>

      <button
        onclick="window.location.href='/leaderboard.html'"
      >
        Leaderboard
      </button>

    </nav>

    <div class="profile">

      <div class="profile-main">

        <img
          id="profile-avatar"
          class="avatar"
          alt="Discord avatar"
        >

        <div>
          <div
            class="profile-name"
            id="profile-name"
          >
            Moderator
          </div>

          <div class="profile-label">
            Chronoverse Staff
          </div>
        </div>

      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Log Out
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="header">

      <div>
        <h1 id="welcome-title">
          Moderator Dashboard
        </h1>

        <p>
          Welcome to the Chronoverse moderation centre.
        </p>
      </div>

      <button
        class="quick-action"
        onclick="window.location.href='/log-action.html'"
      >
        + Log Action
      </button>

    </header>

    <section class="cards">

      <div class="card">
        <div class="card-title">
          Your Actions
        </div>

        <div
          class="card-value"
          id="my-actions"
        >
          0
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          Pending Requests
        </div>

        <div
          class="card-value"
          id="pending-requests"
        >
          0
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          Your Rank
        </div>

        <div
          class="card-value"
          id="my-rank"
        >
          —
        </div>
      </div>

    </section>

    <section class="section">

      <h2>
        Recent Activity
      </h2>

      <div
        class="empty"
        id="activity"
      >
        Loading activity...
      </div>

    </section>

  </main>

  <script>
    const userId =
      localStorage.getItem("discord_user_id");

    const username =
      localStorage.getItem("discord_username");

    const avatar =
      localStorage.getItem("discord_avatar");

    if (!userId || !username) {
      window.location.replace("/");
    }

    document.getElementById(
      "profile-name"
    ).textContent =
      username || "Moderator";

    document.getElementById(
      "welcome-title"
    ).textContent =
      username
        ? `Welcome, ${username}`
        : "Moderator Dashboard";

    const avatarElement =
      document.getElementById(
        "profile-avatar"
      );

    if (avatar) {
      avatarElement.src = avatar;
    } else {
      avatarElement.style.display =
        "none";
    }

    function logout() {
      localStorage.removeItem(
        "discord_user_id"
      );

      localStorage.removeItem(
        "discord_username"
      );

      localStorage.removeItem(
        "discord_avatar"
      );

      window.location.replace("/");
    }
  </script>

  <script src="/js/dashboard.js"></script>

</body>
</html>
```
