<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Chronoverse • Announcements
  </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 45px 25px;
    }

    .back {
      display: inline-block;
      color: #9292a7;
      margin-bottom: 28px;
      text-decoration: none;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9292a7;
      margin-bottom: 28px;
    }

    .composer,
    .announcement {
      background: #11111b;
      border: 1px solid #252535;
      border-radius: 14px;
    }

    .composer {
      padding: 22px;
      margin-bottom: 28px;
    }

    .composer h2 {
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #2c2c3d;
      border-radius: 8px;
      background: #0b0b12;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #11111b;
      font-weight: 700;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 14px;
      color: #9292a7;
    }

    .error {
      color: #ffbcbc;
    }

    .success {
      color: #b9ffcf;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .announcement {
      padding: 22px;
    }

    .announcement h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .content {
      color: #d2d2dc;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }

    .meta {
      color: #77778b;
      font-size: 12px;
    }

    .loading,
    .empty {
      padding: 40px;
      text-align: center;
      color: #9292a7;
    }
  </style>
</head>

<body>

  <main class="page">

    <a
      href="/dashboard.html"
      class="back"
    >
      ← Back to Dashboard
    </a>

    <h1>Announcements</h1>

    <p class="subtitle">
      Chronoverse staff announcements.
    </p>

    <section class="composer">

      <h2>
        Post Announcement
      </h2>

      <form id="form">

        <div class="field">
          <label for="title">
            Title
          </label>

          <input
            id="title"
            required
            maxlength="100"
          >
        </div>

        <div class="field">
          <label for="content">
            Message
          </label>

          <textarea
            id="content"
            required
            maxlength="2000"
          ></textarea>
        </div>

        <button type="submit">
          Post Announcement
        </button>

        <div
          id="message"
          class="message"
        ></div>

      </form>

    </section>

    <section
      id="list"
      class="list"
    >
      <div class="loading">
        Loading announcements...
      </div>
    </section>

  </main>

  <script>
    const form =
      document.getElementById("form");

    const message =
      document.getElementById("message");

    async function requireLogin() {
      const response =
        await fetch("/api/auth/me");

      if (!response.ok) {
        window.location.replace("/");
        return false;
      }

      return true;
    }

    async function loadAnnouncements() {
      const list =
        document.getElementById("list");

      try {
        const response =
          await fetch(
            "/api/announcements/list"
          );

        if (response.status === 401) {
          window.location.replace("/");
          return;
        }

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(data.error);
        }

        const announcements =
          data.announcements || [];

        if (!announcements.length) {
          list.innerHTML = `
            <div class="empty">
              No announcements yet.
            </div>
          `;

          return;
        }

        list.innerHTML =
          announcements.map(item => `
            <article class="announcement">

              <h3>
                ${escapeHtml(item.title)}
              </h3>

              <div class="content">
                ${escapeHtml(item.content)}
              </div>

              <div class="meta">
                Posted by
                ${escapeHtml(item.author_name)}
                •
                ${formatDate(item.created_at)}
              </div>

            </article>
          `).join("");

      } catch (error) {
        console.error(error);

        list.innerHTML = `
          <div class="empty">
            Unable to load announcements.
          </div>
        `;
      }
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        message.textContent =
          "Posting...";

        message.className =
          "message";

        try {
          const response =
            await fetch(
              "/api/announcements/create",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  title:
                    document
                      .getElementById("title")
                      .value
                      .trim(),

                  content:
                    document
                      .getElementById("content")
                      .value
                      .trim()
                })
              }
            );

          const data =
            await response.json();

          if (response.status === 401) {
            window.location.replace("/");
            return;
          }

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Unable to post"
            );
          }

          form.reset();

          message.textContent =
            "Announcement posted.";

          message.className =
            "message success";

          await loadAnnouncements();

        } catch (error) {
          message.textContent =
            error.message;

          message.className =
            "message error";
        }
      }
    );

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

      return new Date(
        value
